<body>
  <header class="site-header">
    <a class="site-header-brand" href="index.html" aria-label="Unlike home">
      <img class="brand-mark-image" src="brand-icon.svg" alt="">
      <span>Unlike<span class="brand-period">.</span></span>

    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">

    <!-- Contact Section -->
    <div class="Contact-back">
    <section id="contact">
    <form class="form-contact" action="https://formspree.io/f/xnndbddn" method="POST">

        <div style="margin-bottom: 30px;">
            <h1>Contact Form</h1>
        </div>

        <div class="form-group">
            <input type="text" name="first" placeholder="First Name" autocomplete="off" required>
        </div>

        <div class="form-group">
            <input type="text" name="last" placeholder="Last Name" autocomplete="off" required>
        </div>

        <div class="form-group">
            <input type="email" name="email" placeholder="Email Address" autocomplete="off" required>
        </div>

        <div class="form-group">
            <textarea rows="5" cols="60" name="message" placeholder="Enter Text" autocomplete="off" required></textarea>
        </div>

        <div class="form-group">
            <button type="submit">Submit</button>
        </div>

    </form>
    </section>
  </div>
